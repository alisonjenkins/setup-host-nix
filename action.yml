name: 'Setup Host Nix'
description: >
  Configure a self-hosted runner to build via the NixOS host's Nix installation
  (mounted /run/current-system/sw + /nix and the host nix-daemon socket).
  Symlinks the nix binaries onto PATH and writes a nix.conf with flakes, caches,
  and tuning. Only works on self-hosted runners with the NixOS host mounts
  (see alisonjenkins/home-cluster nix-builder-common-values).

inputs:
  max-jobs:
    description: 'nix max-jobs (concurrent derivations).'
    required: false
    default: '1'
  cores:
    description: 'nix cores per job. max-jobs * cores bounds total compiler procs.'
    required: false
    default: '4'
  extra-substituters:
    description: 'Space-separated extra binary cache substituters.'
    required: false
    default: 'https://cache.nixcache.org https://nix-community.cachix.org'
  extra-trusted-public-keys:
    description: 'Space-separated trusted public keys for extra-substituters.'
    required: false
    default: 'nixcache.org-1:fd7sIL2BDxZa68s/IqZ8kvDsxsjt3SV4mQKdROuPoak= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs='

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        SHN_MAX_JOBS: ${{ inputs.max-jobs }}
        SHN_CORES: ${{ inputs.cores }}
        SHN_SUBS: ${{ inputs.extra-substituters }}
        SHN_KEYS: ${{ inputs.extra-trusted-public-keys }}
      run: |
        set -euo pipefail

        # Use the host's Nix via the mounted /run/current-system/sw.
        NIX_SW="/usr/local/nixos-sw/bin"
        if [ ! -x "$NIX_SW/nix" ]; then
          echo "::error::Host Nix not found at $NIX_SW/nix — is /run/current-system/sw mounted? This action only works on a NixOS host-nix self-hosted runner."
          exit 1
        fi

        # Symlink only the nix binaries — adding the full NixOS sw/bin to PATH
        # would make GHA use NixOS bash as the step shell, breaking things.
        mkdir -p /tmp/nix-bin
        for cmd in nix nix-build nix-channel nix-collect-garbage nix-copy-closure \
                   nix-daemon nix-env nix-hash nix-instantiate nix-prefetch-url \
                   nix-shell nix-store git; do
          [ -x "$NIX_SW/$cmd" ] && ln -sf "$NIX_SW/$cmd" /tmp/nix-bin/
        done
        echo "/tmp/nix-bin" >> "$GITHUB_PATH"
        echo "NIX_CONF_DIR=/tmp/nix-conf" >> "$GITHUB_ENV"

        # Write nix.conf. Unquoted heredoc so the input-derived vars interpolate.
        mkdir -p /tmp/nix-conf
        cat > /tmp/nix-conf/nix.conf <<NIXCONF
        experimental-features = nix-command flakes
        max-jobs = ${SHN_MAX_JOBS}
        cores = ${SHN_CORES}
        eval-cache = true
        http-connections = 128
        max-substitution-jobs = 128
        narinfo-cache-negative-ttl = 3600
        connect-timeout = 5
        stalled-download-timeout = 10
        fallback = true
        extra-substituters = ${SHN_SUBS}
        extra-trusted-public-keys = ${SHN_KEYS}
        NIXCONF
        sed -i 's/^        //' /tmp/nix-conf/nix.conf

        echo "Using host Nix: $("$NIX_SW/nix" --version)"
